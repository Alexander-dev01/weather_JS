<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather</title>
  <link rel="stylesheet" href="src/style/reset.css">
  <link rel="stylesheet" href="src/style/variables.css">
  <link rel="stylesheet" href="src/style/global.css">
  <link rel="stylesheet" href="src/style/header.css">
  <link rel="stylesheet" href="src/style/main.css">
  <link rel="stylesheet" href="src/style/footer.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <div class="logo">
          <div class="logo__img"> <img src="src/images/logo.png" alt="logo"></div>
          <span class="logo__text">Погода</span>
        </div>
        <button class="global__button location">
          <span class="global__icon"><img src="src/images/mestopolozenie.png" class="icon" alt="местоположение"></span>
          <span class="location__text">г. москва</span>
        </button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="main-inner">
        <div class="weather__img"><img src="src/images/weather/pasmurno.png" alt="" class="weather__img-img"></div>
        <div class="weather__description">
          <button class="global__button description__data ">
            <span class="global__icon description__data-img"><img src="src/images/data.png" class="icon" alt=""></span>
            <span class="description__data-text">23.03.2022 г.</span>
          </button>
          <div class="description__inner">
            <div class="description__t">23 градуса</div>
            <div class="description__name">Дождь</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer-text">Это подвал)</div></div>
    </div>
  </footer>
  <script src="src/js/index.js"></script>
</body>

</html>
