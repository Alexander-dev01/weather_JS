<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>weather</title>
  <link rel="icon" type="image/svg+xml" href="src/images/logo.png" />
  <link rel="stylesheet" href="src/style/reset.css">
  <link rel="stylesheet" href="src/style/fonts.css">
  <link rel="stylesheet" href="src/style/variables.css">
  <link rel="stylesheet" href="src/style/global.css">
  <link rel="stylesheet" href="src/style/header.css">
  <link rel="stylesheet" href="src/style/main.css">
  <link rel="stylesheet" href="src/style/footer.css">
  <link rel="stylesheet" href="src/style/dark.css">
</head>

<body>
  <header class="header">
    <div class="container">
      <div class="header-inner">
        <div class="logo">
          <div class="logo__img"> <img src="src/images/logo.png" alt="logo"></div>
          <span class="logo__text">Погода</span>
        </div>

        <div class="header_right">
          <button class="button" data-js-theme>
            <img class="icon" src="src/images/theme.png" alt="start">
          </button>
          <select class="select" form="weather__form" name="location" data-js-location>
            <option value="moscow">г. Москва</option>
            <option value="rostovNaDonu">г. Ростов-на-Дону</option>
            <option value="saintPetersburg">г. Санкт-Петербург</option>
          </select>
        </div>

      </div>
    </div>
  </header>

  <main class="main">
    <div class="container">
      <div class="main-inner">

        <form id="weather__form" class="weather__description light">
          <div class="description__date ">

            <input class="radio " type="radio" name="date" value="segodnya" id="segodnya" checked>
            <label class="radio__text" for="segodnya">
              <img class="icon" src="src/images/data.png" alt="date">
              Сегодня
            </label>

            <input class="radio " type="radio" name="date" value="zawtra" id="zawtra">
            <label class="radio__text" for="zawtra">
              <img class="icon" src="src/images/data.png" alt="date">
              Завтра
            </label>
          </div>

          <div class="description__content light">
            <div class="description__t">
              <span data-js-temperature>Жми "Узнать погоду!"</span>
            </div>
            <div class="description__name" data-js-weather></div>
          </div>
        </form>

        <div class="weather__img light">
          <img data-js-image src="src/images/weather/empty.png" alt="" class="weather__img-img">
        </div>

      </div>




      <div class="main__start-button light">
        <button class="button" type="submit" form="weather__form" data-js-submit>
          <img class="icon" src="src/images/start.png" alt="start">
          <span>Узнать погоду!</span>
        </button>
      </div>
    </div>
  </main>


  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <div class="footer__text">Это подвал)</div>
      </div>
    </div>
  </footer>
  <script src="src/js/index.js"></script>
  <script src="src/js/darkTheme.js"></script>
</body>

</html>
